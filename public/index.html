<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PayU S2S Store</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <style>
    :root {
      --brand: #409eff;
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #303133;
      --muted: #909399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, "PingFang SC", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app-header {
      background: linear-gradient(135deg, #1d3557 0%, #457b9d 100%);
      color: #fff;
      padding: 20px 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.12);
    }
    .app-header h1 { margin: 0 0 4px; font-size: 24px; font-weight: 600; }
    .app-header p { margin: 0; opacity: .85; font-size: 14px; }
    .layout {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px 48px;
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 1px 8px rgba(0,0,0,.06);
    }
    .panel-title {
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .product-card {
      border: 1px solid #ebeef5;
      border-radius: 10px;
      overflow: hidden;
      transition: box-shadow .2s, transform .2s;
    }
    .product-card:hover {
      box-shadow: 0 6px 20px rgba(64,158,255,.15);
      transform: translateY(-2px);
    }
    .product-img {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      background: linear-gradient(180deg, #f5f9ff, #eef4fb);
    }
    .product-body { padding: 14px; }
    .product-name { font-weight: 600; margin-bottom: 4px; }
    .product-desc { font-size: 12px; color: var(--muted); min-height: 32px; }
    .product-price { color: var(--brand); font-weight: 700; font-size: 18px; margin: 10px 0; }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: 700;
      margin: 12px 0 20px;
      padding-top: 12px;
      border-top: 1px dashed #dcdfe6;
    }
    .badge-s2s {
      display: inline-block;
      background: rgba(255,255,255,.2);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      margin-left: 8px;
    }
    .qr-box {
      text-align: center;
      padding: 16px;
      background: #fafcff;
      border: 1px dashed #c6e2ff;
      border-radius: 8px;
      margin-top: 12px;
    }
    .qr-box img { max-width: 220px; }
    .response-box {
      margin-top: 16px;
      max-height: 240px;
      overflow: auto;
      background: #1e1e1e;
      color: #d4d4d4;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .empty-cart { text-align: center; color: var(--muted); padding: 24px 0; }
  </style>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>PayU S2S Store <span class="badge-s2s">Server-to-Server</span></h1>
      <p>PHP backend + Element Plus UI — Card, UPI &amp; Net Banking</p>
    </header>

    <div class="layout">
      <section class="panel">
        <h2 class="panel-title">Products</h2>
        <div class="product-grid">
          <div v-for="p in products" :key="p.id" class="product-card">
            <div class="product-img">{{ p.emoji }}</div>
            <div class="product-body">
              <div class="product-name">{{ p.name }}</div>
              <div class="product-desc">{{ p.description }}</div>
              <div class="product-price">₹{{ p.price.toFixed(2) }}</div>
              <el-button type="primary" size="small" @click="addToCart(p)" :disabled="inCart(p.id)">
                {{ inCart(p.id) ? 'In Cart' : 'Add to Cart' }}
              </el-button>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel">
        <h2 class="panel-title">Checkout</h2>

        <div v-if="!cart.length" class="empty-cart">
          <el-empty description="Your cart is empty" :image-size="80" />
        </div>

        <template v-else>
          <div v-for="item in cart" :key="item.id" class="summary-row">
            <span>{{ item.name }} × {{ item.qty }}</span>
            <span>₹{{ (item.price * item.qty).toFixed(2) }}</span>
          </div>
          <div class="summary-total">
            <span>Total</span>
            <span>₹{{ totalAmount.toFixed(2) }}</span>
          </div>

          <el-form :model="customer" label-position="top" size="default">
            <el-form-item label="Full Name" required>
              <el-input v-model="customer.firstname" placeholder="Ashish Kumar" />
            </el-form-item>
            <el-form-item label="Email" required>
              <el-input v-model="customer.email" placeholder="test@example.com" />
            </el-form-item>
            <el-form-item label="Phone" required>
              <el-input v-model="customer.phone" placeholder="9876543210" />
            </el-form-item>
          </el-form>

          <el-tabs v-model="paymentMode" type="border-card">
            <el-tab-pane label="Card" name="card">
              <el-alert type="info" :closable="false" show-icon title="Classic S2S Card" description="Test card: 5123456789012346 | CVV 123 | Exp 05/2030" style="margin-bottom: 12px;" />
              <el-form label-position="top" size="small">
                <el-form-item label="Card Number">
                  <el-input v-model="card.number" placeholder="5123456789012346" maxlength="19" />
                </el-form-item>
                <el-row :gutter="8">
                  <el-col :span="12">
                    <el-form-item label="Expiry Month">
                      <el-input v-model="card.exp_month" placeholder="05" maxlength="2" />
                    </el-form-item>
                  </el-col>
                  <el-col :span="12">
                    <el-form-item label="Expiry Year">
                      <el-input v-model="card.exp_year" placeholder="2030" maxlength="4" />
                    </el-form-item>
                  </el-col>
                </el-row>
                <el-row :gutter="8">
                  <el-col :span="12">
                    <el-form-item label="CVV">
                      <el-input v-model="card.cvv" placeholder="123" maxlength="4" show-password />
                    </el-form-item>
                  </el-col>
                  <el-col :span="12">
                    <el-form-item label="Name on Card">
                      <el-input v-model="card.name" placeholder="Test User" />
                    </el-form-item>
                  </el-col>
                </el-row>
                <el-form-item label="Card Type">
                  <el-select v-model="card.bankcode" style="width: 100%;">
                    <el-option label="Credit Card (CC)" value="CC" />
                    <el-option label="Debit Card (VISA)" value="VISA" />
                    <el-option label="Debit Card (MAST)" value="MAST" />
                  </el-select>
                </el-form-item>
              </el-form>
            </el-tab-pane>

            <el-tab-pane label="UPI" name="upi">
              <el-radio-group v-model="upiType" style="margin-bottom: 12px;">
                <el-radio-button label="collect">UPI Collect (VPA)</el-radio-button>
                <el-radio-button label="intent">UPI Intent (QR)</el-radio-button>
              </el-radio-group>

              <template v-if="upiType === 'collect'">
                <el-alert type="info" :closable="false" show-icon title="UPI Collect S2S" description="Test VPA: anything@payu" style="margin-bottom: 12px;" />
                <el-form label-position="top" size="small">
                  <el-form-item label="UPI ID (VPA)">
                    <el-input v-model="vpa" placeholder="yourname@paytm">
                      <template #append>
                        <el-button :loading="validatingVpa" @click="validateVpa">Validate</el-button>
                      </template>
                    </el-input>
                  </el-form-item>
                </el-form>
                <el-tag v-if="vpaValid === true" type="success">Valid VPA{{ vpaName ? ': ' + vpaName : '' }}</el-tag>
                <el-tag v-if="vpaValid === false" type="danger">Invalid VPA</el-tag>
              </template>

              <template v-else>
                <el-alert type="warning" :closable="false" show-icon title="UPI Intent S2S" description="A QR code / deeplink will be generated for the customer to scan and pay." />
                <el-form label-position="top" size="small" style="margin-top: 12px;">
                  <el-form-item label="UPI App Preference">
                    <el-select v-model="upiApp" style="width: 100%;">
                      <el-option label="Generic QR" value="qr" />
                      <el-option label="Google Pay" value="gpay" />
                      <el-option label="PhonePe" value="phonepe" />
                      <el-option label="Paytm" value="paytm" />
                    </el-select>
                  </el-form-item>
                </el-form>
              </template>
            </el-tab-pane>

            <el-tab-pane label="Net Banking" name="netbanking">
              <el-alert type="info" :closable="false" show-icon title="Net Banking S2S" description="Use TESTPGNB for sandbox testing." style="margin-bottom: 12px;" />
              <el-form label-position="top" size="small">
                <el-form-item label="Select Bank">
                  <el-select v-model="selectedBank" filterable style="width: 100%;" placeholder="Choose bank">
                    <el-option
                      v-for="b in banks"
                      :key="b.code"
                      :label="b.name + (b.test ? ' (Test)' : '')"
                      :value="b.code"
                    />
                  </el-select>
                </el-form-item>
              </el-form>
            </el-tab-pane>
          </el-tabs>

          <el-button
            type="primary"
            size="large"
            style="width: 100%; margin-top: 16px;"
            :loading="paying"
            @click="payNow"
          >
            Pay ₹{{ totalAmount.toFixed(2) }}
          </el-button>

          <el-button
            v-if="lastTxnId"
            size="small"
            style="width: 100%; margin-top: 8px;"
            :loading="verifying"
            @click="verifyLastPayment"
          >
            Verify Payment ({{ lastTxnId }})
          </el-button>

          <div v-if="qrImage" class="qr-box">
            <p><strong>Scan to pay via UPI</strong></p>
            <img :src="qrImage" alt="UPI QR Code" />
            <p style="font-size: 12px; color: #909399; word-break: break-all;">{{ upiDeeplink }}</p>
          </div>

          <div v-if="lastResponse" class="response-box">{{ lastResponse }}</div>
        </template>
      </aside>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const products = ref([
          { id: 1, name: 'Wireless Earbuds', description: 'ANC, 30hr battery', price: 2499, emoji: '🎧' },
          { id: 2, name: 'Smart Watch', description: 'Fitness tracking & GPS', price: 4999, emoji: '⌚' },
          { id: 3, name: 'USB-C Hub', description: '7-in-1 adapter', price: 1299, emoji: '🔌' },
          { id: 4, name: 'Desk Lamp', description: 'LED with wireless charging', price: 1899, emoji: '💡' },
        ]);

        const cart = ref([]);
        const customer = ref({ firstname: 'Test User', email: 'test@example.com', phone: '9876543210' });
        const paymentMode = ref('card');
        const upiType = ref('collect');
        const upiApp = ref('qr');
        const vpa = ref('anything@payu');
        const vpaValid = ref(null);
        const vpaName = ref('');
        const validatingVpa = ref(false);
        const card = ref({ number: '5123456789012346', cvv: '123', exp_month: '05', exp_year: '2030', name: 'Test User', bankcode: 'CC' });
        const banks = ref([]);
        const selectedBank = ref('TESTPGNB');
        const paying = ref(false);
        const verifying = ref(false);
        const lastTxnId = ref('');
        const lastResponse = ref('');
        const qrImage = ref('');
        const upiDeeplink = ref('');

        const totalAmount = computed(() => cart.value.reduce((s, i) => s + i.price * i.qty, 0));
        const productinfo = computed(() => cart.value.map(i => i.name).join(', ') || 'Store Purchase');

        const inCart = (id) => cart.value.some(i => i.id === id);
        const addToCart = (p) => {
          if (!inCart(p.id)) cart.value.push({ ...p, qty: 1 });
        };

        const api = async (path, body) => {
          const res = await fetch('/api/' + path, {
            method: body ? 'POST' : 'GET',
            headers: body ? { 'Content-Type': 'application/json' } : {},
            body: body ? JSON.stringify(body) : undefined,
          });
          return res.json();
        };

        const loadBanks = async () => {
          try {
            const data = await api('banks.php');
            if (data.success) {
              banks.value = data.banks;
              if (data.test_card) {
                card.value.number = data.test_card.number;
                card.value.cvv = data.test_card.cvv;
                card.value.exp_month = data.test_card.exp_month;
                card.value.exp_year = data.test_card.exp_year;
                card.value.name = data.test_card.name;
              }
              if (data.test_vpa) vpa.value = data.test_vpa;
            }
          } catch (e) {
            ElementPlus.ElMessage.error('Failed to load bank list');
          }
        };

        const validateVpa = async () => {
          validatingVpa.value = true;
          vpaValid.value = null;
          try {
            const data = await api('validate-vpa.php', { vpa: vpa.value });
            vpaValid.value = !!data.valid;
            vpaName.value = data.payer_name || '';
            ElementPlus.ElMessage[data.valid ? 'success' : 'warning'](data.valid ? 'VPA is valid' : 'VPA validation failed');
          } catch (e) {
            ElementPlus.ElMessage.error('VPA validation error');
          } finally {
            validatingVpa.value = false;
          }
        };

        const resolvePaymentMode = () => {
          if (paymentMode.value === 'card') return 'card';
          if (paymentMode.value === 'netbanking') return 'netbanking';
          return upiType.value === 'intent' ? 'upi_intent' : 'upi_collect';
        };

        const buildPayload = () => {
          const payload = {
            payment_mode: resolvePaymentMode(),
            amount: totalAmount.value.toFixed(2),
            productinfo: productinfo.value,
            customer: customer.value,
          };
          if (payload.payment_mode === 'card') payload.card = card.value;
          if (payload.payment_mode === 'upi_collect') payload.vpa = vpa.value;
          if (payload.payment_mode === 'upi_intent') payload.upi_app = upiApp.value;
          if (payload.payment_mode === 'netbanking') payload.bankcode = selectedBank.value;
          return payload;
        };

        const showQr = (deeplink) => {
          upiDeeplink.value = deeplink;
          qrImage.value = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(deeplink);
        };

        const handleNextAction = (action, full) => {
          if (!action) return;
          if (action.type === 'redirect' && action.url) {
            ElementPlus.ElMessage.info('Redirecting to bank...');
            window.location.href = action.url;
            return;
          }
          if (action.type === 'form_post' && action.url && action.fields) {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = action.url;
            Object.entries(action.fields).forEach(([k, v]) => {
              const input = document.createElement('input');
              input.type = 'hidden';
              input.name = k;
              input.value = v;
              form.appendChild(input);
            });
            document.body.appendChild(form);
            form.submit();
            return;
          }
          if (action.type === 'upi_qr' && action.deeplink) {
            showQr(action.deeplink);
            ElementPlus.ElMessage.success('Scan the QR code to complete UPI payment');
            return;
          }
          if (action.type === 'success') {
            ElementPlus.ElMessage.success(action.message || 'Payment successful');
            return;
          }
          if (action.type === 'failure') {
            ElementPlus.ElMessage.error(action.message || 'Payment failed');
            return;
          }
          ElementPlus.ElMessage.info(action.message || 'Payment initiated — poll verify or wait for callback');
        };

        const payNow = async () => {
          if (!customer.value.firstname || !customer.value.email || !customer.value.phone) {
            ElementPlus.ElMessage.warning('Please fill customer details');
            return;
          }
          paying.value = true;
          qrImage.value = '';
          lastResponse.value = '';
          try {
            const data = await api('initiate-payment.php', buildPayload());
            lastResponse.value = JSON.stringify(data, null, 2);
            lastTxnId.value = data.txnid || '';
            if (!data.success) {
              ElementPlus.ElMessage.error(data.message || 'Payment initiation failed');
              return;
            }
            handleNextAction(data.next_action, data);
          } catch (e) {
            ElementPlus.ElMessage.error('Network error: ' + e.message);
          } finally {
            paying.value = false;
          }
        };

        const verifyLastPayment = async () => {
          if (!lastTxnId.value) return;
          verifying.value = true;
          try {
            const data = await api('verify-payment.php', { txnid: lastTxnId.value });
            lastResponse.value = JSON.stringify(data, null, 2);
            ElementPlus.ElMessage.success('Verification response received');
          } catch (e) {
            ElementPlus.ElMessage.error('Verify failed');
          } finally {
            verifying.value = false;
          }
        };

        onMounted(loadBanks);

        return {
          products, cart, customer, paymentMode, upiType, upiApp, vpa, vpaValid, vpaName,
          validatingVpa, card, banks, selectedBank, paying, verifying, lastTxnId, lastResponse,
          qrImage, upiDeeplink, totalAmount, inCart, addToCart, validateVpa, payNow, verifyLastPayment,
        };
      },
    }).use(ElementPlus).mount('#app');
  </script>
</body>
</html>
